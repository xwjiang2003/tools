<div style="display:flex;gap:16px;flex-direction:column">
  <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)">
    <div class="row" style="margin-bottom:12px">
      <span style="font-weight:600;font-size:14px;white-space:nowrap">正则表达式:</span>
      <span style="font-family:monospace;font-size:16px;color:var(--text-secondary)">/</span>
      <input type="text" class="expr-input" id="regexPattern" placeholder="正则模式" style="flex:1;min-width:200px" oninput="liveRegex()">
      <span style="font-family:monospace;font-size:16px;color:var(--text-secondary)">/</span>
      <label class="checkbox-label"><input type="checkbox" id="regexFlagG" checked onchange="liveRegex()" title="全局">g</label>
      <label class="checkbox-label"><input type="checkbox" id="regexFlagI" onchange="liveRegex()" title="忽略大小写">i</label>
      <label class="checkbox-label"><input type="checkbox" id="regexFlagM" onchange="liveRegex()" title="多行">m</label>
      <label class="checkbox-label"><input type="checkbox" id="regexFlagS" onchange="liveRegex()" title="点匹配换行">s</label>
      <label class="checkbox-label"><input type="checkbox" id="regexFlagU" onchange="liveRegex()" title="Unicode">u</label>
    </div>
    <div class="row" style="margin-bottom:12px;gap:8px">
      <button class="btn btn-primary btn-sm" onclick="liveRegex()">测试匹配</button>
      <button class="btn btn-sm" onclick="document.getElementById('regexPattern').value='';document.getElementById('regexInput').value='';document.getElementById('regexResult').innerHTML='';document.getElementById('regexReplaceResult').style.display='none'">清空</button>
      <span style="font-size:12px;color:var(--text-secondary);margin-left:auto">常用:</span>
      <button class="btn btn-sm" onclick="setRegexPattern('[\\\\w.-]+@[\\\\w.-]+\\\\.[a-z]{2,}')">邮箱</button>
      <button class="btn btn-sm" onclick="setRegexPattern('1[3-9]\\\\d{9}')">手机号</button>
      <button class="btn btn-sm" onclick="setRegexPattern('https?://[\\\\w.-]+\\\\.[a-z]{2,}(/\\\\S*)?')">URL</button>
    </div>
  </div>
  <div class="tool-layout" style="height:auto;max-height:none;min-height:400px">
    <div class="input-panel">
      <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> 测试文本</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="clearTa('regexInput');document.getElementById('regexResult').innerHTML=''">清空</button><button class="btn btn-sm" onclick="document.getElementById('regexInput').value='test@example.com\nadmin@site.cn\n\n联系电话: 13812345678\n网址: https://www.example.com/path'">示例</button></div></div>
      <textarea class="ta-input" id="regexInput" placeholder="输入要匹配的文本，匹配结果会在右侧高亮显示..." oninput="liveRegex()"></textarea>
    </div>
    <div class="ops-panel">
      <div class="result-panel" style="flex:1">
        <div class="result-panel-header"><span class="result-panel-title">匹配结果 <span id="regexMatchCount" style="color:var(--text-secondary)"></span></span></div>
        <div class="result-content" id="regexResult"><span style="color:var(--text-muted)">输入正则表达式和测试文本</span></div>
      </div>
      <div class="result-panel" id="regexReplacePanel" style="display:none;flex:0 0 auto;max-height:200px">
        <div class="result-panel-header"><span class="result-panel-title">替换测试</span></div>
        <div style="padding:8px 12px;display:flex;gap:8px">
          <input type="text" class="expr-input" id="regexReplaceWith" placeholder="替换为 ($1可引用分组)" style="flex:1" oninput="liveRegex()">
          <button class="btn btn-sm btn-primary" onclick="liveRegex()">预览</button>
        </div>
        <div class="result-content" id="regexReplaceResult" style="max-height:100px"></div>
      </div>
      <button class="btn btn-sm" style="align-self:flex-start" onclick="toggleReplacePanel()">🔀 替换模式</button>
    </div>
  </div>
</div>

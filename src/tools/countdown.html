<div class="tool-card" id="cdTool">
  <div class="tool-card-title">倒计时</div>
  <div class="tool-card-desc">输入一个 Unix 时间戳（秒或毫秒，自动识别），实时显示距离该时刻还有多久，或已过去多久。</div>
  <label class="form-label">目标时间戳（秒或毫秒）</label>
  <div class="row"><input type="text" class="expr-input" id="cdInput" placeholder="输入时间戳，如 1700000000" style="flex:1"></div>
  <div id="cdResult" class="dt-center" style="margin-top:16px"></div>
  <div id="cdShare" style="display:none" class="dt-center"><button class="btn btn-sm" onclick="shareCountdownLink()">复制分享链接</button></div>
</div>

<div class="tool-layout">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> 源代码输入</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="clearTa('codeInput')">清空</button><button class="btn btn-sm" onclick="loadCodeDemo()">示例</button></div></div>
    <textarea class="ta-input" id="codeInput" placeholder="粘贴代码..."></textarea>
  </div>
  <div class="ops-panel">
    <div class="op-buttons" id="codeOpBtns">
      <button class="op-btn active" data-op="html">HTML</button><button class="op-btn" data-op="css">CSS</button>
      <button class="op-btn" data-op="js">JavaScript</button><button class="op-btn" data-op="sql">SQL</button>
      <button class="op-btn" data-op="xml">XML</button>
    </div>
    <div class="op-options" id="codeOpOptions">
      <button class="btn btn-sm btn-primary" onclick="runCodeOp('format')">格式化</button>
      <button class="btn btn-sm btn-primary" onclick="runCodeOp('compress')">压缩</button>
      <select class="format-select" id="codeIndent"><option value="2">2 空格</option><option value="4" selected>4 空格</option><option value="tab">Tab</option></select>
    </div>
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title" id="codeResultTitle">HTML 格式化</span><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="copyTextById('codeResult')">复制</button></div></div>
      <div class="result-content" id="codeResult"><span style="color:var(--text-muted)">粘贴代码并选择操作</span></div>
    </div>
    <div class="info-stats" id="codeStats" style="display:none"></div>
  </div>
</div>

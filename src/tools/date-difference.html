<div class="tool-card" id="diffTool">
  <div class="tool-card-title">日期差值计算</div>
  <div class="tool-card-desc">选择或输入两个日期时间，计算它们之间的间隔（天 / 时 / 分 / 秒）。按本地时区解释。</div>
  <div class="row" style="gap:16px;flex-wrap:wrap">
    <div><label class="form-label">开始日期</label><input type="datetime-local" class="format-select" id="diffA"></div>
    <div><label class="form-label">结束日期</label><input type="datetime-local" class="format-select" id="diffB"></div>
  </div>
  <div id="diffResult" class="dt-center" style="margin-top:18px"></div>
</div>

<div class="tool-card" id="calcTool">
  <div class="tool-card-title">日期加减计算</div>
  <div class="tool-card-desc">在基准日期上增加或减少若干年 / 月 / 日，自动处理月末与跨年（如 2 月 28 日加 1 天得 3 月 1 日）。</div>
  <label class="form-label">基准日期</label>
  <input type="date" class="format-select" id="calcBase">
  <div class="row" style="gap:16px;flex-wrap:wrap;margin-top:10px">
    <div><label class="form-label">年</label><input type="number" class="expr-input" id="calcYears" value="0" style="width:80px"></div>
    <div><label class="form-label">月</label><input type="number" class="expr-input" id="calcMonths" value="0" style="width:80px"></div>
    <div><label class="form-label">日</label><input type="number" class="expr-input" id="calcDays" value="0" style="width:80px"></div>
  </div>
  <div id="calcResult" class="dt-center" style="margin-top:18px"></div>
</div>

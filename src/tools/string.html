<div class="tool-layout">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> 文本输入</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="clearTa('strInput')">清空</button><button class="btn btn-sm" onclick="document.getElementById('strInput').value='Hello World\nhello javascript\nHello World\n  \n你好 世界\nHello World!'">示例</button></div></div>
    <textarea class="ta-input" id="strInput" placeholder="输入文本..." oninput="autoStrCount()"></textarea>
    <div class="info-stats" id="strStats" style="display:flex">字符: 0 | 单词: 0 | 行: 0 | 字节: 0</div>
  </div>
  <div class="ops-panel">
    <div class="op-buttons" id="strOpBtns">
      <button class="op-btn active" data-op="case">大小写</button><button class="op-btn" data-op="sort">排序</button>
      <button class="op-btn" data-op="dedup">去重</button><button class="op-btn" data-op="replace">替换</button>
      <button class="op-btn" data-op="splitjoin">分割/合并</button><button class="op-btn" data-op="liner">行操作</button>
    </div>
    <div class="op-options" id="strOpOptions"></div>
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title" id="strResultTitle">大小写转换</span><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="copyTextById('strResult')">复制</button></div></div>
      <div class="result-content" id="strResult"><span style="color:var(--text-muted)">选择操作开始</span></div>
    </div>
  </div>
</div>

<script>window.__TL__ = {{TL_JSON}};</script>
<div class="tool-layout">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> {{TL:input_title}}</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="punyClear()">{{TL:clear}}</button><button class="btn btn-sm" onclick="punySample()">{{TL:sample}}</button></div></div>
    <textarea class="ta-input" id="punyInput" spellcheck="false" autocomplete="off" placeholder="{{TL:ph}}"></textarea>
    <div class="info-stats" style="display:flex">{{TL:tip}}</div>
  </div>
  <div class="ops-panel">
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title">{{TL:result_title}}</span><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="copyTextById('punyResult')">{{TL:copy}}</button></div></div>
      <div class="result-content" id="punyResult" style="padding:0"></div>
    </div>
  </div>
</div>
<div class="tl-sec">
  <h3 class="tl-sec-title">{{TL:why_title}}</h3>
  <p class="tl-note">{{TL:why_note}}</p>
  <div class="dt-scroll">
    <table class="dt-table">
      <thead><tr><th>{{TL:t_unicode}}</th><th>{{TL:t_ascii}}</th><th>{{TL:t_meaning}}</th></tr></thead>
      <tbody id="punyExamples"></tbody>
    </table>
  </div>
</div>
<script>
(function () {
  function fill() {
    var L = window.__TL__ || {};
    var rows = L.examples || [];
    var box = document.getElementById('punyExamples');
    if (!box) return;
    var html = '';
    for (var i = 0; i < rows.length; i++) {
      html += '<tr><td>' + escHtml(rows[i][0]) + '</td><td><code>' + escHtml(rows[i][1]) +
        '</code></td><td class="tl-wrap">' + escHtml(rows[i][2]) + '</td></tr>';
    }
    box.innerHTML = html;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fill);
  else fill();
})();
</script>

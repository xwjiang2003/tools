<div class="tool-layout" id="uuidTool">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> UUID 解析与生成</div></div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
      <input type="text" class="expr-input" id="uuidInput" placeholder="粘贴 UUID，如 123e4567-e89b-12d3-a456-426614174000" />
      <div class="row" style="gap:10px">
        <button class="btn" id="uuidGenBtn">生成 v4</button>
      </div>
    </div>
  </div>
  <div class="ops-panel">
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title">解析结果</span></div>
      <div class="result-content" id="uuidResult" style="overflow:auto"></div>
    </div>
  </div>
</div>

<div class="tool-layout">
  <div class="input-panel" style="overflow-y:auto">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> 参数配置</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="cronReset()">清空</button></div></div>
    <div style="padding:16px;display:flex;flex-direction:column;gap:20px">
      <div class="op-options"><span>minute</span><select id="cronMinute"></select><span class="cron-start" style="display:none">start<input type="number" id="cronMinuteStart" min="0" max="59" placeholder="0" inputmode="numeric"></span></div>
      <div class="op-options"><span>hour</span><select id="cronHour"></select><span class="cron-start" style="display:none">start<input type="number" id="cronHourStart" min="0" max="23" placeholder="0" inputmode="numeric"></span></div>
      <div class="op-options"><span>day</span><select id="cronDay"></select><span class="cron-start" style="display:none">start<input type="number" id="cronDayStart" min="1" max="31" placeholder="1" inputmode="numeric"></span></div>
      <div class="op-options"><span>month</span><select id="cronMonth"></select><span class="cron-start" style="display:none">start<input type="number" id="cronMonthStart" min="1" max="12" placeholder="1" inputmode="numeric"></span></div>
      <div class="op-options"><span>weekday</span><select id="cronWeekday"></select><span class="cron-start" style="display:none">start<input type="number" id="cronWeekdayStart" min="0" max="6" placeholder="0" inputmode="numeric"></span></div>
    </div>
  </div>
  <div class="ops-panel">
    <div class="op-buttons"><button class="op-btn active" onclick="cronBuild()">生成</button></div>
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title">输出结果</span><div class="row" style="gap:4px"><button class="btn btn-sm" id="cronDlBtn" onclick="cronDownload()" disabled>下载</button><button class="btn btn-sm" onclick="copyTextById('cronResult')">复制</button></div></div>
      <div class="result-content" id="cronResult"><span style="color:var(--text-muted)">选择操作开始</span></div>
    </div>
  </div>
</div>
<script>
// Cron expression generator: the five standard cron fields, nothing else.
// Field labels are the canonical cron field names (code identifiers), and every
// option value is a number, a */n step, or a start/step pair — so the UI needs
// no translation. The optional "start" input rewrites */n into n/step (5/2 =
// starting at 5, every 2); an empty start, or one equal to the field minimum,
// keeps the canonical */n form.
(function(){
  var WEEKDAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var FIELDS = [
    { id: 'cronMinute',  min: 0, max: 59, every: 'minute',  plural: 'minutes',  steps: [2, 5, 10, 15, 30] },
    { id: 'cronHour',    min: 0, max: 23, every: 'hour',    plural: 'hours',    steps: [2, 5, 10, 15] },
    { id: 'cronDay',     min: 1, max: 31, every: 'day',     plural: 'days',     steps: [2, 5, 10, 15, 30] },
    { id: 'cronMonth',   min: 1, max: 12, every: 'month',   plural: 'months',   steps: [2, 3, 4, 6] },
    { id: 'cronWeekday', min: 0, max: 6,  every: 'weekday', plural: 'weekdays', steps: [2, 3] }
  ];
  function fillSelect(id, values, everyLabel){
    var html = '<option value="*">* (every ' + everyLabel + ')</option>';
    for (var i = 0; i < values.length; i++) {
      html += '<option value="' + values[i].value + '">' + values[i].text + '</option>';
    }
    document.getElementById(id).innerHTML = html;
  }
  function range(a, b){ var out = []; for (var i = a; i <= b; i++) out.push(i); return out; }
  function stepOptions(def){
    return def.steps.map(function(n){
      return { value: '*/' + n, text: '*/' + n + ' (every ' + n + ' ' + def.plural + ')' };
    });
  }
  function valueOptions(def){
    if (def.id === 'cronMonth') {
      return range(1, 12).map(function(n){ return { value: String(n), text: n + ' (' + MONTH_NAMES[n - 1] + ')' }; });
    }
    if (def.id === 'cronWeekday') {
      return range(0, 6).map(function(d){ return { value: String(d), text: d + ' (' + WEEKDAY_NAMES[d] + ')' }; });
    }
    if (def.id === 'cronDay') {
      return range(1, 31).map(function(n){ return { value: String(n), text: String(n) }; });
    }
    return range(def.min, def.max).map(function(n){ return { value: String(n), text: ('0' + n).slice(-2) }; });
  }
  function val(id){ return document.getElementById(id).value; }
  function startInput(def){ return document.getElementById(def.id + 'Start'); }
  function isStep(def){ return /^\*\/\d+$/.test(val(def.id)); }
  function syncStart(def){
    var el = startInput(def);
    var on = isStep(def);
    el.parentNode.style.display = on ? '' : 'none';
    el.disabled = !on;
  }
  // */n with a start above the field minimum becomes start/n (5/2); an empty,
  // malformed or out-of-range start falls back to the canonical */n form.
  function fieldValue(def){
    var v = val(def.id);
    var m = /^\*\/(\d+)$/.exec(v);
    if (!m) return v;
    var raw = startInput(def).value.replace(/^\s+|\s+$/g, '');
    if (raw === '' || !/^\d+$/.test(raw)) return v;
    var s = parseInt(raw, 10);
    if (s < def.min || s > def.max || s === def.min) return v;
    return s + '/' + m[1];
  }
  function setDl(on){ var b = document.getElementById('cronDlBtn'); if (b) b.disabled = !on; }
  var lastCron = '';
  function cronBuild(){
    var expr = FIELDS.map(fieldValue).join(' ');
    document.getElementById('cronResult').textContent = expr;
    lastCron = expr;
    setDl(true);
  }
  function initFields(){
    FIELDS.forEach(function(def){
      fillSelect(def.id, stepOptions(def).concat(valueOptions(def)), def.every);
      startInput(def).value = '';
      syncStart(def);
    });
  }
  window.cronReset = function(){
    initFields();
    document.getElementById('cronResult').innerHTML = '<span style="color:var(--text-muted)">选择操作开始</span>';
    lastCron = '';
    setDl(false);
  };
  window.cronBuild = cronBuild;
  window.cronDownload = function(){
    if (!lastCron) { toast('没有可下载的结果'); return; }
    downloadText('crontab.txt', lastCron + '\n', 'text/plain');
  };
  FIELDS.forEach(function(def){
    document.getElementById(def.id).addEventListener('change', function(){
      syncStart(def);
      if (lastCron) cronBuild();
    });
    startInput(def).addEventListener('input', function(){
      if (lastCron) cronBuild();
    });
  });
  // tool body script runs before core.js: defer field fill until DOM ready
  if (document.readyState === 'loading') { document.addEventListener('DOMContentLoaded', initFields); }
  else { initFields(); }
})();
</script>

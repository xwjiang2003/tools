<div class="tool-layout">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> 输入</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="clearTa('hashInput');document.getElementById('hashFileInput').value=''">清空</button></div></div>
    <textarea class="ta-input" id="hashInput" placeholder="输入要计算哈希的文本，或使用下方文件上传..." style="min-height:250px"></textarea>
    <div style="padding:12px 16px;border-top:1px solid var(--border)">
      <label class="form-label">文件哈希</label>
      <div class="row"><input type="file" id="hashFileInput" style="font-size:12px;flex:1" onchange="hashFile()"><button class="btn btn-sm" onclick="document.getElementById('hashFileInput').value='';document.getElementById('hashFileResult').innerHTML=''">清除</button></div>
      <div class="hash-output" id="hashFileResult" style="margin-top:8px;font-size:12px;color:var(--text-secondary)">选择文件后自动计算哈希值</div>
    </div>
  </div>
  <div class="ops-panel">
    <div class="op-buttons" id="hashOpBtns">
      <button class="op-btn active" data-op="md5">MD5</button><button class="op-btn" data-op="sha1">SHA-1</button>
      <button class="op-btn" data-op="sha256">SHA-256</button><button class="op-btn" data-op="sha512">SHA-512</button>
      <button class="op-btn" data-op="hmac">HMAC</button><button class="op-btn" data-op="aes">AES</button>
    </div>
    <div class="op-options" id="hashOpOptions"></div>
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title" id="hashResultTitle">MD5 哈希</span><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="copyTextById('hashResult')">复制</button></div></div>
      <div style="padding:16px">
        <div class="hash-output" id="hashResult">请输入文本或选择文件</div>
      </div>
    </div>
    <div style="font-size:12px;color:var(--text-secondary)">💡 MD5/SHA-1 仅用于校验，不应用于安全场景</div>
  </div>
</div>

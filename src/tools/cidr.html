<script>window.__TL__ = {{TL_JSON}};</script>
<div class="tool-layout">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> {{TL:input_title}}</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="cidrClear()">{{TL:clear}}</button><button class="btn btn-sm" onclick="cidrSample()">{{TL:sample}}</button></div></div>
    <textarea class="ta-input" id="cidrInput" spellcheck="false" autocomplete="off" placeholder="{{TL:ph}}">192.168.1.130/26</textarea>
    <div class="info-stats" id="cidrStat" style="display:none"></div>
  </div>
  <div class="ops-panel">
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title">{{TL:result_title}}</span><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="copyTextById('cidrResult')">{{TL:copy}}</button></div></div>
      <div class="result-content" id="cidrResult" style="padding:0"></div>
    </div>
  </div>
</div>
<div class="tl-sec">
  <h3 class="tl-sec-title">{{TL:mask_title}}</h3>
  <p class="tl-note">{{TL:mask_note}}</p>
  <div id="cidrMaskTable"></div>
</div>

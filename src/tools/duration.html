<div class="tool-card" id="durTool">
  <div class="tool-card-title">ISO 8601 时长换算</div>
  <div class="tool-card-desc">在「时长字符串」与「秒数」之间互转。格式示例：P1Y2M3DT4H5M6S、P1W、PT1H30M。年按 365 天、月按 30 天近似换算。</div>
  <label class="form-label">时长 → 秒（如 P1DT12H）</label>
  <input type="text" class="expr-input" id="durToSec" placeholder="P1DT12H" style="max-width:320px">
  <div class="hash-output" id="durSecOut" style="margin-top:6px"></div>
  <label class="form-label" style="margin-top:12px">秒 → 时长</label>
  <input type="text" class="expr-input" id="durToIso" placeholder="90061" style="max-width:320px">
  <div class="hash-output" id="durIsoOut" style="margin-top:6px"></div>
</div>

<div class="tool-layout">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> 输入</div><div class="row" style="gap:4px"><button class="btn btn-sm" onclick="gofmtClear()">清空</button><button class="btn btn-sm" onclick="gofmtSample()">示例</button></div></div>
    <textarea class="ta-input" id="gofmtInput" placeholder="Paste Go source code here, e.g. package main&#10;import &quot;fmt&quot;&#10;func main(){fmt.Println(&quot;hi&quot;)}"></textarea>
  </div>
  <div class="ops-panel">
    <div class="op-buttons"><button class="op-btn active" onclick="gofmtRun()">格式化</button></div>
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title">输出结果</span><div class="row" style="gap:4px"><button class="btn btn-sm" id="gofmtDlBtn" onclick="gofmtDownload()" disabled>下载</button><button class="btn btn-sm" onclick="copyTextById('gofmtResult')">复制</button></div></div>
      <div class="result-content" id="gofmtResult"><span style="color:var(--text-muted)">选择操作开始</span></div>
    </div>
  </div>
</div>
<script>
// gofmt.wasm is self-hosted at /assets/cdn/gofmt/ (MIT License, wasm-fmt).
// Hand-inlined equivalent of the @wasm-fmt/gofmt web entry + binding (3.3 KB total):
// plain fetch + WebAssembly.instantiate, no ES module or external script needed,
// matching the site rule that third-party assets are always self-hosted.
(function(){
  var wasm = null, loading = null;
  var enc = new TextEncoder(), dec = new TextDecoder();
  function initWasm(){
    if (wasm) return Promise.resolve(wasm);
    if (loading) return loading;
    loading = fetch('/assets/cdn/gofmt/gofmt.wasm')
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
      .then(function(buf){ return WebAssembly.instantiate(buf, {}); })
      .then(function(res){
        var w = res.instance.exports;
        w._initialize();
        wasm = w;
        return w;
      })
      .catch(function(e){ loading = null; throw e; });
    return loading;
  }
  // Same contract as the @wasm-fmt/gofmt binding: result 0 = already gofmt-formatted
  // (returned unchanged), 1 = formatted, anything else = Go source error (line:col message).
  function fmt(src){
    try {
      var bytes = enc.encode(src);
      var ptr = wasm.alloc(bytes.length);
      new Uint8Array(wasm.memory.buffer, ptr, bytes.length).set(bytes);
      var result = wasm.format();
      if (result === 0) return src;
      var text = dec.decode(new Uint8Array(wasm.memory.buffer, wasm.output_ptr(), wasm.output_len()));
      if (result === 1) return text;
      throw new Error(text);
    } finally {
      wasm.dispose();
    }
  }
  var lastGo = { text:'', name:'main.go', mime:'text/x-go' };
  function setDl(on){ var b=document.getElementById('gofmtDlBtn'); if(b) b.disabled=!on; }
  function gofmtRun(){
    var src = getVal('gofmtInput');
    var out = document.getElementById('gofmtResult');
    if(!src.trim()){ out.innerHTML='<span style="color:var(--text-muted)">选择操作开始</span>'; lastGo.text=''; setDl(false); return; }
    initWasm().then(function(){
      var text = fmt(src);
      out.textContent = text;
      lastGo.text = text;
      setDl(true);
      toast('格式化完成');
    }).catch(function(e){
      out.innerHTML='<span style="color:#dc2626">错误: '+escHtml(e.message)+'</span>';
      lastGo.text='';
      setDl(false);
    });
  }
  window.gofmtClear=function(){ setVal('gofmtInput',''); var out=document.getElementById('gofmtResult'); out.innerHTML='<span style="color:var(--text-muted)">选择操作开始</span>'; lastGo.text=''; setDl(false); };
  window.gofmtSample=function(){
    setVal('gofmtInput',
      'package main\n\nimport "fmt"\n\nfunc main(){\nfmt.Println( "hello, gofmt" )\n}\n');
    gofmtRun();
  };
  window.gofmtRun=gofmtRun;
  window.gofmtDownload=function(){ if(!lastGo.text){ toast('没有可下载的结果'); return; } downloadText(lastGo.name, lastGo.text, lastGo.mime); };
  var el=document.getElementById('gofmtInput'); if(el){ el.addEventListener('input', function(){ lastGo.text=''; setDl(false); }); }
  // Pre-warm: silently load the wasm once the page is ready so the first Format click
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', function(){ initWasm().catch(function(){}); }); }
  else { initWasm().catch(function(){}); }
})();
</script>

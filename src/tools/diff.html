<div class="diff-page-layout">
  <!-- Toolbar -->
  <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow-sm)">
    <div class="row" style="justify-content:space-between">
      <div class="row">
        <span style="font-weight:600;font-size:14px">文本比对</span>
        <select class="format-select" id="diffViewMode" onchange="updateDiffView()">
          <option value="unified">统一视图</option>
          <option value="sidebyside">左右对照</option>
        </select>
        <label class="checkbox-label"><input type="checkbox" id="diffCaseSensitive" checked onchange="doTextDiff()"> 区分大小写</label>
        <label class="checkbox-label"><input type="checkbox" id="diffIgnoreWS" onchange="doTextDiff()"> 忽略空白</label>
      </div>
      <button class="btn btn-primary" onclick="doTextDiff()">比对差异</button>
    </div>
  </div>
  <!-- Main area -->
  <div class="row" style="flex:1;min-height:0;gap:12px;align-items:stretch">
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px">原始文本 A</div>
      <textarea class="ta-input diff-textarea" id="textDiffInputA" placeholder="输入原始文本..." oninput="doTextDiff()" style="min-height:300px;flex:1"></textarea>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div style="font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px">对比文本 B</div>
      <textarea class="ta-input diff-textarea" id="textDiffInputB" placeholder="输入对比文本..." oninput="doTextDiff()" style="min-height:300px;flex:1"></textarea>
    </div>
  </div>
  <!-- Diff result -->
  <div class="result-panel" style="flex:1;min-height:200px">
    <div class="result-panel-header">
      <span class="result-panel-title" id="diffStatsLabel">差异结果</span>
      <div class="row" style="gap:4px"><button class="btn btn-sm" onclick="copyTextDiffResult()">复制</button></div>
    </div>
    <div class="result-content" id="textDiffResult" style="font-family:'JetBrains Mono',monospace;font-size:12px">
      <span style="color:var(--text-muted)">在左右两侧输入文本，自动实时比对</span>
    </div>
  </div>
</div>

<div class="tool-layout" id="hexTool">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> 十六进制转换</div></div>
    <div style="padding:20px;display:flex;flex-direction:column;gap:14px">
      <input type="text" class="expr-input" id="hexInput" placeholder="输入十六进制数，如 FF、0xFF、1A2B、deadbeef" />
      <div class="result-panel" style="flex:1">
        <div class="result-panel-header"><span class="result-panel-title">转换结果</span></div>
        <div class="result-content" id="hexResult" style="overflow:auto"></div>
      </div>
    </div>
  </div>
  <div class="ops-panel">
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title">各进制表示</span></div>
      <div class="result-content" id="hexExtra" style="overflow:auto"></div>
    </div>
  </div>
</div>

<script>window.__TL__ = {{TL_JSON}};</script>
<div class="tool-layout">
  <div class="input-panel">
    <div class="input-panel-header"><div class="input-panel-title"><span class="dot"></span> {{TL:input_title}}</div></div>
    <div style="padding:16px 16px 0">
      <div class="tl-field"><label>{{TL:f_user}}</label><input class="tl-input" id="htUser" autocomplete="off" spellcheck="false"></div>
      <div class="tl-field"><label>{{TL:f_pass}}</label><input class="tl-input" id="htPass" autocomplete="off" spellcheck="false"></div>
      <div class="tl-field"><label>{{TL:f_algo}}</label>
        <div class="tl-chips" id="htAlgo" style="margin:0">
          <button class="tl-chip active" type="button" data-algo="apr1">apr1 (MD5)</button>
          <button class="tl-chip" type="button" data-algo="sha">SHA-1</button>
          <button class="tl-chip" type="button" data-algo="plain">plain</button>
        </div>
      </div>
      <div class="tl-field"><label>{{TL:f_salt}}</label><input class="tl-input" id="htSaltShow" readonly><button class="btn btn-sm" type="button" onclick="htNewSalt()">{{TL:new_salt}}</button></div>
    </div>
  </div>
  <div class="ops-panel">
    <div class="result-panel" style="flex:1">
      <div class="result-panel-header"><span class="result-panel-title">{{TL:result_title}}</span></div>
      <div class="result-content" id="htOut" style="padding:14px 16px"></div>
    </div>
  </div>
</div>
<div class="tl-sec">
  <h3 class="tl-sec-title">{{TL:note_title}}</h3>
  <p class="tl-note">{{TL:note_body}}</p>
</div>

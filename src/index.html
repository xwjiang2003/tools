<!-- ========== Analytics: busuanzi ==========
     Loaded on production only; skipped for file:// previews and localhost so local
     testing never pollutes the live numbers.
     Source: https://busuanzi.ibruce.info/ (free third-party service, aggregated by
     domain, no dashboard). -->
<script>
(function () {
  var host = location.hostname;
  if (location.protocol === 'file:' || !host || host === 'localhost' || host === '127.0.0.1') return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
  s.referrerPolicy = 'no-referrer-when-downgrade';
  // If the service is unreachable, drop the counter entirely rather than showing an empty slot
  s.onerror = function () {
    var f = document.getElementById('footerStats');
    if (f && f.parentNode) f.parentNode.removeChild(f);
  };
  document.body.appendChild(s);
})();
</script>

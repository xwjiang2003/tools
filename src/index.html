<!-- 图标：绝对路径（页面分布在 /、/en/、/blog/<slug>/ 多层，相对路径要逐层算）。
     ICO 与 SVG 都声明 —— 老浏览器只认 /favicon.ico，现代浏览器优先用矢量版，
     且 .ico 落在发布目录根，浏览器自动请求 /favicon.ico 时也不会 404。 -->
<link rel="icon" href="/favicon.ico" sizes="48x48 32x32 16x16">

<!-- ===== 站点归属验证（拿到验证码后取消注释并填入 content 即可）=====
     2026-09 起本站迁到自定义域名 https://devtools.help/，本站发布目录根（docs/）就是主机根，
     所以两种验证方式都可用：
       - 文件验证：把 baidu_verify_xxx.html / googleXXXX.html 放进本仓库 docs/ 目录；
       - 标记验证：取消下面某一行注释并填入验证码（改的是本文件，构建后需重新推送）。
     注意：验证是按「域名」算的，换到 devtools.help 需要重新验证，旧 github.io 资源的验证不能复用。
     Google Search Console / Bing 网站管理员工具 / 百度搜索资源平台 均支持这两种方式。 -->
<!-- <meta name="google-site-verification" content="粘贴 Google Search Console 的验证码"> -->
<!-- <meta name="msvalidate.01" content="粘贴 Bing 网站管理员工具的验证码"> -->
<!-- <meta name="baidu-site-verification" content="粘贴百度搜索资源平台的验证码"> -->
<!-- JS 不可用时的兜底：窄屏抽屉靠 body.nav-open 打开，没有 JS 就永远打不开。
     这里把导航退回成可用的换行布局（会多占几行，但菜单一定点得到）。
     放在 head 里是为了避免加载后再回退造成的闪烁。 -->
<noscript><style>@media(max-width:900px){.nav-toggle{display:none}.top-nav{position:static;display:flex;flex-direction:row;flex-wrap:wrap;border-bottom:0;box-shadow:none;padding:6px 0 0;max-height:none;overflow:visible}.nav-dropdown{width:auto}.nav-trigger{width:auto;font-size:14px}}</style></noscript>
{{AUTODETECT}}
{{ANALYTICS}}
</head>
<body>
<header class="header">
  <a class="logo" href="{{HOME}}" aria-label="DevTools 首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    <span class="logo-text">DevTools</span>
  </a>
  <!-- 窄屏导航开关：桌面端由 CSS 隐藏，手机端把整个导航收进抽屉。
       不加这个的话，6 个分类下拉 + 2 个平级链接会让 sticky 的 header 在
       390px 屏上换行成 7 行、占掉屏幕顶部约三分之一，右侧按钮还会被挤出视口。 -->
  <button class="nav-toggle" id="navToggle" type="button"
          aria-label="打开导航菜单" aria-expanded="false" aria-controls="topNav">
    <span></span><span></span><span></span>
  </button>
  <nav class="top-nav" id="topNav">
{{NAV}}
  </nav>
  <div class="header-actions">{{FEEDBACK_BTN}}{{LANGSWITCH}}<button class="theme-toggle" id="themeToggle" title="切换暗色模式">🌓</button></div>
</header>

<!-- Ad slot: top banner 970x90 / 728x90.
     Currently empty and hidden. When an ad network is wired up, drop the `hidden`
     attribute and replace the placeholder below with the ad code. -->

  </div>
</div>

<main class="main">
<div class="page active" id="page-{{PAGE}}">
{{TOOL}}
</div>

{{SEO}}
</main>

<!-- ========== Analytics: busuanzi ==========
     Loaded on production only; skipped for file:// previews and localhost so local
     testing never pollutes the live numbers.
     Source: https://busuanzi.ibruce.info/ (free third-party service, aggregated by
     domain, no dashboard). -->
<script>
(function () {
  var host = location.hostname;
  if (location.protocol === 'file:' || !host || host === 'localhost' || host === '127.0.0.1') return;
  var s = document.createElement('script');
  s.async = true;
  s.src = 'https://busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js';
  s.referrerPolicy = 'no-referrer-when-downgrade';
  // If the service is unreachable, drop the counter entirely rather than showing an empty slot
  s.onerror = function () {
    var f = document.getElementById('footerStats');
    if (f && f.parentNode) f.parentNode.removeChild(f);
  };
  document.body.appendChild(s);
})();
</script>
{{FEEDBACK_MODAL}}

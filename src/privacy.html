<!DOCTYPE html>
<html lang="{{LANG}}" data-page="privacy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESCRIPTION}}">
<meta name="keywords" content="{{KEYWORDS}}">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:site_name" content="DevTools">
<meta name="theme-color" content="#4a90d9">
{{HREFLANG}}
<link rel="stylesheet" href="css/style.css">
{{AUTODETECT}}
</head>
<body>
<header class="header">
  <a class="logo" href="{{HOME}}" aria-label="DevTools 首页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
    DevTools
  </a>
  <nav class="top-nav" id="topNav">
{{NAV}}
  </nav>
  <div class="header-actions">{{LANGSWITCH}}<button class="theme-toggle" id="themeToggle" title="切换暗色模式">🌓</button></div>
</header>

<main class="main">
<section class="seo-content legal">
{{PRIVACY_BODY}}
</section>
</main>

<footer class="footer">
  <nav class="footer-links">{{FOOTER_LINKS}}<a href="{{BASE}}privacy.html">隐私政策</a></nav>
  <div class="footer-note">工具输入的数据仅在浏览器本地处理，不会上传到服务器</div>
</footer>

<script>
// 主题切换（与工具页保持一致的 localStorage key）
(function () {
  var root = document.documentElement;
  if (localStorage.getItem('devtools-theme') === 'dark') root.setAttribute('data-theme', 'dark');
  document.getElementById('themeToggle').onclick = function () {
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('devtools-theme', next);
  };
})();
</script>
</body>
</html>

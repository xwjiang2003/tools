# 更新「今日科技热榜」并重建站点。
#
# ⚠️ 2026-10-10 起：每日自动执行已迁移到新服务器（AWS EC2 ap-southeast-2）的 cron，
#    由 /opt/tools/deploy.sh 完成「拉取源码 → 抓热榜 → 构建 → 校验 → 原子发布」。
#    本 workflow 的定时触发已停用，只保留手动触发（workflow_dispatch）。
#
# 为什么要迁走：站点 DNS 已经从 GitHub Pages 切到自建服务器，GitHub Pages 不再服务真实
#    流量，而它每天一次的自动提交仍会让 master 分支天天变动。更关键的是 GitHub Pages 的
#    Last-Modified 取的是「部署时间」而不是文件 mtime，全站每天被刷一遍时间戳会让百度
#    认为全站更新、触发全量重抓，在跨境慢链路上大面积超时（见 baidu-traffic-diagnosis）。
#    服务器上的 nginx 按文件真实 mtime 返回，只有热榜相关页面会变，没有这个副作用。
#
# 想改回 GitHub Actions 每天自动跑：把下面 schedule 那三行的注释去掉即可。
#    注意别让两边同时跑——服务器 cron 是 UTC 00:17，错开时间。
name: Daily tech news

on:
  # schedule:
  #   - cron: '17 0 * * *'     # UTC 00:17 = 北京时间 08:17（刻意避开整点）
  workflow_dispatch:          # 支持在 Actions 页面手动跑一次

# 定时任务要能提交产物，必须显式给写权限
permissions:
  contents: write
  pages: write

# 同一时间只跑一个，避免手动触发和定时任务撞车
concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 抓取。单个源失败不影响整体：失败的源会沿用上一次的数据，
      # 页面照常构建，只是那一条会标注「上次成功抓取」的时间。
      - name: Fetch news
        run: python3 fetch_news.py

      # 重建全站（中英双语所有页面 + sitemap + robots + llms.txt）
      - name: Build site
        run: python3 build.py

      # 产物静态校验。check.py 需要 node 做内联脚本语法检查，runner 自带。
      - name: Verify output
        run: python3 check.py docs

      - name: Commit and push
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if git diff --cached --quiet; then
            echo '没有变化，跳过提交'
            exit 0
          fi
          git commit -m "chore(news): 更新 $(date -u +%Y-%m-%d) 科技热榜

          由 .github/workflows/daily-news.yml 自动生成。"
          git push

      # 用 GITHUB_TOKEN 推送不会触发任何 workflow，也就不会自动触发 Pages 构建，
      # 所以这里显式请求一次。失败不阻塞：即使不触发，下一次推送也会带上这批产物。
      - name: Trigger Pages rebuild
        if: steps.commit.outcome == 'success'
        continue-on-error: true
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds"

      # 顺带把新页面推给搜索引擎。IndexNow 无账号、无配额限制，失败也不影响发布。
      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: python3 submit.py
